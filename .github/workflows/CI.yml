name: Build Debug APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :smarttubetv:assembleStmobileDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTube-debug-apk
          path: smarttubetv/build/outputs/renamed_apks/stmobileDebug/NewTube_*.apk
          if-no-files-found: error
